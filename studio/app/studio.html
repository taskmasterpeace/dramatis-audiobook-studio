<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Movie Studio — Production Console</title>
<link rel="stylesheet" href="/studio.css">
<link rel="icon" type="image/svg+xml" href="/shared/logo-mark.svg">
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="brand" style="text-align:center">
      <a href="/" class="brand-home" aria-label="Audio Movie Studio home">
        <img src="/shared/logo-stacked.svg" alt="Audio Movie Studio" class="studio-logo">
      </a>
      <small><span class="rec" id="rec"></span>PRODUCTION CONSOLE</small>
    </div>
    <div class="nav" id="nav"></div>
    <div class="rail-foot">
      <div id="gpu"><span class="lamp" id="lamp"></span><span id="gputxt">idle</span></div>
      <div id="ticker"></div>
      <div style="font-size:10px;letter-spacing:.14em;color:var(--dim);border:1px dashed var(--line);border-radius:4px;padding:3px 6px;text-align:center">IMAGES &amp; VIDEO: MANUAL ONLY</div>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>
<script src="/app.js"></script>
</body>
</html>
